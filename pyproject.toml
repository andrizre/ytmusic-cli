[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ytmusic-cli"
version = "0.1.0"
description = "YouTube Music CLI sederhana: search + stream playback"
requires-python = ">=3.10"
dependencies = ["ytmusicapi>=1.11", "yt-dlp>=2024.8.0"]

[project.optional-dependencies]
dev = ["mypy>=1.10", "ruff>=0.8"]

[project.scripts]
ytmusic = "ytmusic_cli.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ytmusic_cli*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Minimal yang lolos di tree saat ini (F = pyflakes + E4/E7/E9 = error sintaks/logika).
# Pengetatan berikutnya (I/isort, UP/pyupgrade, B/bugbear, S/bandit, format)
# dilakukan setelah `ruff check --select ALL` + `ruff format` dirapikan.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
show_error_codes = true
